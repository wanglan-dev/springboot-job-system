<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>校企协同实习就业管理系统</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Helvetica Neue', Helvetica, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', Arial, sans-serif; }
        .el-header {
            background: linear-gradient(90deg, #409EFF 0%, #67C23A 100%);
            color: #fff;
            line-height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
        }
        .header-title { font-size: 18px; font-weight: 600; }
        .header-right { display: flex; align-items: center; gap: 15px; }
        .el-aside { background-color: #304156; color: #fff; min-height: calc(100vh - 60px); }
        .el-menu { border-right: none; }
        .el-main { background-color: #f0f2f5; padding: 0; }
        iframe { width: 100%; height: calc(100vh - 60px); border: none; background: #fff; }
        .user-info { color: #fff; font-size: 14px; }
    </style>
</head>
<body>
    <div id="app">
        <el-container>
            <el-header>
                <div class="header-title">🏫 校企协同实习就业管理系统</div>
                <div class="header-right">
                    <span class="user-info">👤 {{ userInfo.realName || userInfo.username }} ({{ userInfo.roleName }})</span>
                    <el-button size="mini" @click="logout">退出登录</el-button>
                </div>
            </el-header>
            <el-container>
                <el-aside width="220px">
                    <el-menu :default-active="activeIndex" background-color="#304156" text-color="#bfcbd9" active-text-color="#409EFF">
                        <!-- 管理员菜单 -->
                        <template v-if="roleCode === 'ADMIN'">
                            <el-menu-item index="1" @click="navigate('dashboard.html')">
                                <i class="el-icon-data-line"></i><span slot="title">📊 数据大屏</span>
                            </el-menu-item>
                            <el-menu-item index="2" @click="navigate('job.html')">
                                <i class="el-icon-suitcase"></i><span slot="title">💼 岗位管理</span>
                            </el-menu-item>
                            <el-menu-item index="3" @click="navigate('delivery.html')">
                                <i class="el-icon-document"></i><span slot="title">📋 投递记录</span>
                            </el-menu-item>
                            <el-menu-item index="4" @click="navigate('audit-company.html')">
                                <i class="el-icon-office-building"></i><span slot="title">✅ 企业审核</span>
                            </el-menu-item>
                            <el-menu-item index="5" @click="navigate('audit-weekly.html')">
                                <i class="el-icon-edit"></i><span slot="title">📝 周记审核</span>
                            </el-menu-item>
                        </template>

                        <!-- 学生菜单 -->
                        <template v-if="roleCode === 'STUDENT'">
                            <el-menu-item index="1" @click="navigate('resume.html')">
                                <i class="el-icon-user"></i><span slot="title">📄 我的简历</span>
                            </el-menu-item>
                            <el-menu-item index="2" @click="navigate('job-list.html')">
                                <i class="el-icon-suitcase"></i><span slot="title">🔍 岗位列表</span>
                            </el-menu-item>
                            <el-menu-item index="3" @click="navigate('weekly.html')">
                                <i class="el-icon-edit"></i><span slot="title">📝 实习周记</span>
                            </el-menu-item>
                        </template>

                        <!-- 企业HR菜单 -->
                        <template v-if="roleCode === 'COMPANY'">
                            <el-menu-item index="1" @click="navigate('company-manage.html')">
                                <i class="el-icon-office-building"></i><span slot="title">🏢 企业管理</span>
                            </el-menu-item>
                            <el-menu-item index="2" @click="navigate('job.html')">
                                <i class="el-icon-suitcase"></i><span slot="title">💼 岗位管理</span>
                            </el-menu-item>
                            <el-menu-item index="3" @click="navigate('delivery-hr.html')">
                                <i class="el-icon-document"></i><span slot="title">📨 投递处理</span>
                            </el-menu-item>
                        </template>

                        <!-- 老师菜单 -->
                        <template v-if="roleCode === 'TEACHER'">
                            <el-menu-item index="1" @click="navigate('dashboard.html')">
                                <i class="el-icon-data-line"></i><span slot="title">📊 数据大屏</span>
                            </el-menu-item>
                            <el-menu-item index="2" @click="navigate('audit-company.html')">
                                <i class="el-icon-office-building"></i><span slot="title">✅ 企业审核</span>
                            </el-menu-item>
                            <el-menu-item index="3" @click="navigate('audit-weekly.html')">
                                <i class="el-icon-edit"></i><span slot="title">📝 周记审核</span>
                            </el-menu-item>
                            <el-menu-item index="4" @click="navigate('delivery.html')">
                                <i class="el-icon-document"></i><span slot="title">📋 投递记录</span>
                            </el-menu-item>
                        </template>
                    </el-menu>
                </el-aside>
                <el-main>
                    <iframe :src="currentPage"></iframe>
                </el-main>
            </el-container>
        </el-container>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@0.27.2/dist/axios.min.js"></script>
    <script>
        const token = localStorage.getItem('token');
        if (!token) { window.location.href = 'login.html'; }
        axios.defaults.headers.common['Authorization'] = 'Bearer ' + token;
        new Vue({
            el: '#app',
            data() {
                return {
                    currentPage: 'dashboard.html',
                    activeIndex: '1',
                    userInfo: JSON.parse(localStorage.getItem('userInfo') || '{}'),
                    roleCode: JSON.parse(localStorage.getItem('userInfo') || '{}').roleCode || 'ADMIN'
                }
            },
            mounted() {
                // 根据角色设置默认首页
                if (this.roleCode === 'STUDENT') { this.currentPage = 'resume.html'; this.activeIndex = '1'; }
                else if (this.roleCode === 'COMPANY') { this.currentPage = 'company-manage.html'; this.activeIndex = '1'; }
                else if (this.roleCode === 'TEACHER') { this.currentPage = 'dashboard.html'; this.activeIndex = '1'; }
            },
            methods: {
                navigate(page) { this.currentPage = page; },
                logout() {
                    this.$confirm('确认退出登录？', '提示', { confirmButtonText: '确定', cancelButtonText: '取消', type: 'warning' })
                        .then(() => { localStorage.clear(); this.$message.success('已退出登录'); window.location.href = 'login.html'; })
                        .catch(() => {});
                }
            }
        });
    </script>
</body>
</html>
