<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>数据大屏</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <style>
        body { margin: 0; padding: 20px; background: #f0f2f5; font-family: 'Microsoft YaHei', sans-serif; }
        .dashboard-title { font-size: 20px; font-weight: 600; color: #303133; margin-bottom: 20px; }
        .stat-cards { display: flex; gap: 20px; margin-bottom: 20px; }
        .stat-card { flex: 1; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); display: flex; align-items: center; }
        .stat-icon { width: 60px; height: 60px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 28px; margin-right: 15px; }
        .stat-icon.blue { background: #ecf5ff; }
        .stat-icon.green { background: #f0f9eb; }
        .stat-icon.orange { background: #fdf6ec; }
        .stat-icon.purple { background: #f5f0ff; }
        .stat-num { font-size: 28px; font-weight: 700; color: #303133; }
        .stat-label { font-size: 14px; color: #909399; margin-top: 5px; }
        .chart-row { display: flex; gap: 20px; margin-bottom: 20px; }
        .chart-box { flex: 1; background: #fff; padding: 20px; border-radius: 8px; box-shadow: 0 2px 12px rgba(0,0,0,0.05); }
        .chart-title { font-size: 16px; font-weight: 600; color: #303133; margin-bottom: 15px; }
        .chart { width: 100%; height: 300px; }
    </style>
</head>
<body>
    <div id="app">
        <div class="dashboard-title">📊 实习就业数据可视化大屏</div>
        <div class="stat-cards">
            <div class="stat-card">
                <div class="stat-icon blue">👨‍🎓</div>
                <div><div class="stat-num">{{ cards.totalStudents }}</div><div class="stat-label">学生总数</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon green">🏢</div>
                <div><div class="stat-num">{{ cards.totalCompanies }}</div><div class="stat-label">合作企业</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon orange">💼</div>
                <div><div class="stat-num">{{ cards.totalJobs }}</div><div class="stat-label">在招岗位</div></div>
            </div>
            <div class="stat-card">
                <div class="stat-icon purple">📨</div>
                <div><div class="stat-num">{{ cards.totalDeliveries }}</div><div class="stat-label">投递总数</div></div>
            </div>
        </div>
        <div class="chart-row">
            <div class="chart-box">
                <div class="chart-title">📊 岗位类型分布（柱状图）</div>
                <div id="chart1" class="chart"></div>
            </div>
            <div class="chart-box">
                <div class="chart-title">🥧 行业岗位分布（饼图）</div>
                <div id="chart2" class="chart"></div>
            </div>
        </div>
        <div class="chart-row">
            <div class="chart-box" style="flex: 2;">
                <div class="chart-title">📈 近7天投递趋势（折线图）</div>
                <div id="chart3" class="chart"></div>
            </div>
            <div class="chart-box">
                <div class="chart-title">🏆 热门岗位TOP5</div>
                <el-table :data="topJobs" size="small" style="margin-top: 10px;">
                    <el-table-column type="index" width="50"></el-table-column>
                    <el-table-column prop="jobName" label="岗位名称"></el-table-column>
                    <el-table-column prop="count" label="投递量" width="80"></el-table-column>
                </el-table>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@0.27.2/dist/axios.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    <script>
        axios.defaults.headers.common['Authorization'] = 'Bearer ' + localStorage.getItem('token');
        new Vue({
            el: '#app',
            data() {
                return {
                    cards: { totalStudents: 0, totalCompanies: 0, totalJobs: 0, totalDeliveries: 0 },
                    topJobs: [],
                    chart1: null, chart2: null, chart3: null
                }
            },
            mounted() {
                this.loadData();
                window.addEventListener('resize', this.resizeCharts);
            },
            beforeDestroy() {
                window.removeEventListener('resize', this.resizeCharts);
            },
            methods: {
                loadData() {
                    axios.get('/api/statistics/dashboard').then(res => {
                        if (res.data.code === 200) {
                            const data = res.data.data;
                            this.cards = data.cards;
                            this.initChart1(data.jobTypeChart);
                            this.initChart2(data.industryChart);
                            this.initChart3(data.trendChart);
                        }
                    });
                    axios.get('/api/statistics/topJobs').then(res => {
                        if (res.data.code === 200) this.topJobs = res.data.data;
                    });
                },
                initChart1(data) {
                    this.chart1 = echarts.init(document.getElementById('chart1'));
                    this.chart1.setOption({
                        tooltip: { trigger: 'axis' },
                        xAxis: { type: 'category', data: data.map(i => i.name) },
                        yAxis: { type: 'value' },
                        series: [{ data: data.map(i => i.value), type: 'bar', itemStyle: { color: '#409EFF', borderRadius: [4, 4, 0, 0] } }]
                    });
                },
                initChart2(data) {
                    this.chart2 = echarts.init(document.getElementById('chart2'));
                    this.chart2.setOption({
                        tooltip: { trigger: 'item' },
                        legend: { bottom: '5%', left: 'center' },
                        series: [{ type: 'pie', radius: ['40%', '70%'], avoidLabelOverlap: false, itemStyle: { borderRadius: 10, borderColor: '#fff', borderWidth: 2 }, label: { show: false }, emphasis: { label: { show: true, fontSize: 16, fontWeight: 'bold' } }, data: data }]
                    });
                },
                initChart3(data) {
                    this.chart3 = echarts.init(document.getElementById('chart3'));
                    this.chart3.setOption({
                        tooltip: { trigger: 'axis' },
                        xAxis: { type: 'category', boundaryGap: false, data: data.dates },
                        yAxis: { type: 'value' },
                        series: [{ data: data.counts, type: 'line', smooth: true, areaStyle: { color: 'rgba(64,158,255,0.2)' }, itemStyle: { color: '#409EFF' }, lineStyle: { width: 3 } }]
                    });
                },
                resizeCharts() {
                    this.chart1 && this.chart1.resize();
                    this.chart2 && this.chart2.resize();
                    this.chart3 && this.chart3.resize();
                }
            }
        });
    </script>
</body>
</html>
