<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>岗位管理</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <style>
        body { margin: 0; padding: 20px; background: #f0f2f5; }
        .page-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: #303133; }
        .search-bar { background: #fff; padding: 20px; border-radius: 4px; margin-bottom: 20px; }
        .table-box { background: #fff; padding: 20px; border-radius: 4px; }
    </style>
</head>
<body>
    <div id="app">
        <div class="page-title">💼 岗位管理</div>
        <div class="search-bar">
            <el-form :inline="true" :model="searchForm">
                <el-form-item label="岗位名称"><el-input v-model="searchForm.jobName" placeholder="请输入岗位名称" clearable></el-input></el-form-item>
                <el-form-item label="工作城市"><el-input v-model="searchForm.city" placeholder="请输入城市" clearable></el-input></el-form-item>
                <el-form-item label="状态">
                    <el-select v-model="searchForm.status" placeholder="全部" clearable>
                        <el-option label="已下架" :value="0"></el-option>
                        <el-option label="招聘中" :value="1"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item>
                    <el-button type="primary" icon="el-icon-search" @click="loadData">查询</el-button>
                    <el-button icon="el-icon-refresh" @click="resetSearch">重置</el-button>
                    <el-button type="success" icon="el-icon-plus" @click="handleAdd">新增岗位</el-button>
                </el-form-item>
            </el-form>
        </div>
        <div class="table-box">
            <el-table :data="tableData" v-loading="loading" border>
                <el-table-column type="index" label="序号" width="60" align="center"></el-table-column>
                <el-table-column prop="jobName" label="岗位名称" min-width="150"></el-table-column>
                <el-table-column prop="companyName" label="所属企业" min-width="120"></el-table-column>
                <el-table-column prop="city" label="工作城市" width="100"></el-table-column>
                <el-table-column label="薪资范围" width="120"><template slot-scope="scope">{{ scope.row.salaryMin }} - {{ scope.row.salaryMax }} 元/天</template></el-table-column>
                <el-table-column prop="education" label="学历要求" width="100"></el-table-column>
                <el-table-column prop="jobType" label="岗位类型" width="100"></el-table-column>
                <el-table-column label="状态" width="80"><template slot-scope="scope"><el-tag :type="scope.row.status === 1 ? 'success' : 'info'">{{ scope.row.status === 1 ? '招聘中' : '已下架' }}</el-tag></template></el-table-column>
                <el-table-column label="操作" width="180" fixed="right">
                    <template slot-scope="scope">
                        <el-button size="mini" type="primary" @click="handleEdit(scope.row)">编辑</el-button>
                        <el-button size="mini" type="danger" @click="handleDelete(scope.row)">删除</el-button>
                    </template>
                </el-table-column>
            </el-table>
            <el-pagination style="margin-top: 20px; text-align: right;" @size-change="handleSizeChange" @current-change="handleCurrentChange" :current-page="page.current" :page-sizes="[10, 20, 50]" :page-size="page.size" layout="total, sizes, prev, pager, next, jumper" :total="page.total"></el-pagination>
        </div>
        <el-dialog :title="dialogTitle" :visible.sync="dialogVisible" width="600px">
            <el-form :model="form" label-width="100px" :rules="formRules" ref="form">
                <el-form-item label="岗位名称" prop="jobName"><el-input v-model="form.jobName"></el-input></el-form-item>
                <el-form-item label="所属企业ID" prop="companyId"><el-input-number v-model="form.companyId" :min="1"></el-input-number></el-form-item>
                <el-form-item label="最低薪资"><el-input-number v-model="form.salaryMin" :min="0"></el-input-number></el-form-item>
                <el-form-item label="最高薪资"><el-input-number v-model="form.salaryMax" :min="0"></el-input-number></el-form-item>
                <el-form-item label="工作城市"><el-input v-model="form.city"></el-input></el-form-item>
                <el-form-item label="学历要求">
                    <el-select v-model="form.education">
                        <el-option label="大专" value="大专"></el-option>
                        <el-option label="本科" value="本科"></el-option>
                        <el-option label="硕士" value="硕士"></el-option>
                        <el-option label="博士" value="博士"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item label="岗位类型"><el-input v-model="form.jobType"></el-input></el-form-item>
                <el-form-item label="岗位描述"><el-input type="textarea" v-model="form.description" rows="3"></el-input></el-form-item>
                <el-form-item label="岗位要求"><el-input type="textarea" v-model="form.requirements" rows="3"></el-input></el-form-item>
                <el-form-item label="状态">
                    <el-radio-group v-model="form.status"><el-radio :label="1">招聘中</el-radio><el-radio :label="0">已下架</el-radio></el-radio-group>
                </el-form-item>
            </el-form>
            <div slot="footer"><el-button @click="dialogVisible = false">取消</el-button><el-button type="primary" @click="submitForm">确定</el-button></div>
        </el-dialog>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@0.27.2/dist/axios.min.js"></script>
    <script>
        axios.defaults.headers.common['Authorization'] = 'Bearer ' + localStorage.getItem('token');
        new Vue({
            el: '#app',
            data() {
                return {
                    loading: false,
                    tableData: [],
                    page: { current: 1, size: 10, total: 0 },
                    searchForm: { jobName: '', city: '', status: null },
                    dialogVisible: false,
                    dialogTitle: '新增岗位',
                    form: { id: null, jobName: '', companyId: 1, salaryMin: 300, salaryMax: 500, city: '', education: '本科', jobType: '', description: '', requirements: '', status: 1 },
                    formRules: { jobName: [{ required: true, message: '请输入岗位名称', trigger: 'blur' }], companyId: [{ required: true, message: '请选择企业', trigger: 'change' }] },
                    isEdit: false
                }
            },
            mounted() { this.loadData(); },
            methods: {
                loadData() {
                    this.loading = true;
                    const params = { current: this.page.current, size: this.page.size, ...this.searchForm };
                    axios.get('/api/job/list', { params }).then(res => {
                        this.loading = false;
                        if (res.data.code === 200) { this.tableData = res.data.data.records; this.page.total = res.data.data.total; }
                    }).catch(() => { this.loading = false; });
                },
                resetSearch() { this.searchForm = { jobName: '', city: '', status: null }; this.page.current = 1; this.loadData(); },
                handleSizeChange(val) { this.page.size = val; this.loadData(); },
                handleCurrentChange(val) { this.page.current = val; this.loadData(); },
                handleAdd() { this.isEdit = false; this.dialogTitle = '新增岗位'; this.form = { id: null, jobName: '', companyId: 1, salaryMin: 300, salaryMax: 500, city: '', education: '本科', jobType: '', description: '', requirements: '', status: 1 }; this.dialogVisible = true; },
                handleEdit(row) { this.isEdit = true; this.dialogTitle = '编辑岗位'; this.form = { ...row }; this.dialogVisible = true; },
                submitForm() {
                    this.$refs.form.validate(valid => {
                        if (valid) {
                            const api = this.isEdit ? axios.put('/api/job', this.form) : axios.post('/api/job', this.form);
                            api.then(res => {
                                if (res.data.code === 200) { this.$message.success(res.data.data); this.dialogVisible = false; this.loadData(); }
                                else { this.$message.error(res.data.msg); }
                            });
                        }
                    });
                },
                handleDelete(row) {
                    this.$confirm('确认删除该岗位？', '提示', { type: 'warning' }).then(() => {
                        axios.delete('/api/job/' + row.id).then(res => { if (res.data.code === 200) { this.$message.success('删除成功'); this.loadData(); } });
                    }).catch(() => {});
                }
            }
        });
    </script>
</body>
</html>
