<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>我的简历</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <style>
        body { margin: 0; padding: 20px; background: #f0f2f5; }
        .page-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: #303133; }
        .form-box { background: #fff; padding: 30px; border-radius: 8px; max-width: 800px; margin: 0 auto; }
    </style>
</head>
<body>
    <div id="app">
        <div class="page-title">📄 我的简历</div>
        <div class="form-box">
            <el-form :model="form" label-width="100px" :rules="rules" ref="form">
                <el-row :gutter="20">
                    <el-col :span="12">
                        <el-form-item label="姓名" prop="realName"><el-input v-model="form.realName"></el-input></el-form-item>
                    </el-col>
                    <el-col :span="12">
                        <el-form-item label="性别"><el-radio-group v-model="form.gender"><el-radio label="男">男</el-radio><el-radio label="女">女</el-radio></el-radio-group></el-form-item>
                    </el-col>
                </el-row>
                <el-row :gutter="20">
                    <el-col :span="12">
                        <el-form-item label="手机号" prop="phone"><el-input v-model="form.phone"></el-input></el-form-item>
                    </el-col>
                    <el-col :span="12">
                        <el-form-item label="邮箱"><el-input v-model="form.email"></el-input></el-form-item>
                    </el-col>
                </el-row>
                <el-row :gutter="20">
                    <el-col :span="12">
                        <el-form-item label="学校"><el-input v-model="form.school"></el-input></el-form-item>
                    </el-col>
                    <el-col :span="12">
                        <el-form-item label="专业"><el-input v-model="form.major"></el-input></el-form-item>
                    </el-col>
                </el-row>
                <el-form-item label="学历">
                    <el-select v-model="form.education">
                        <el-option label="大专" value="大专"></el-option>
                        <el-option label="本科" value="本科"></el-option>
                        <el-option label="硕士" value="硕士"></el-option>
                        <el-option label="博士" value="博士"></el-option>
                    </el-select>
                </el-form-item>
                <el-form-item label="技能特长"><el-input type="textarea" v-model="form.skills" rows="3" placeholder="如：Java、Python、Vue..."></el-input></el-form-item>
                <el-form-item label="实习经历"><el-input type="textarea" v-model="form.experience" rows="4" placeholder="描述你的实习或项目经历..."></el-input></el-form-item>
                <el-form-item label="自我评价"><el-input type="textarea" v-model="form.selfEval" rows="3"></el-input></el-form-item>
                <el-form-item>
                    <el-button type="primary" @click="submitForm">保存简历</el-button>
                    <el-button @click="resetForm">重置</el-button>
                </el-form-item>
            </el-form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@0.27.2/dist/axios.min.js"></script>
    <script>
        axios.defaults.headers.common['Authorization'] = 'Bearer ' + localStorage.getItem('token');
        new Vue({
            el: '#app',
            data() {
                return {
                    form: { id: null, realName: '', gender: '男', phone: '', email: '', school: '', major: '', education: '本科', skills: '', experience: '', selfEval: '' },
                    rules: { realName: [{ required: true, message: '请输入姓名', trigger: 'blur' }], phone: [{ required: true, message: '请输入手机号', trigger: 'blur' }] }
                }
            },
            mounted() { this.loadResume(); },
            methods: {
                loadResume() {
                    axios.get('/api/resume/my').then(res => {
                        if (res.data.code === 200 && res.data.data) { this.form = res.data.data; }
                    });
                },
                submitForm() {
                    this.$refs.form.validate(valid => {
                        if (valid) {
                            const api = this.form.id ? axios.put('/api/resume', this.form) : axios.post('/api/resume', this.form);
                            api.then(res => { if (res.data.code === 200) { this.$message.success('保存成功'); this.loadResume(); } else { this.$message.error(res.data.msg); } });
                        }
                    });
                },
                resetForm() { this.$refs.form.resetFields(); }
            }
        });
    </script>
</body>
</html>
