<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>企业审核</title>
    <link rel="stylesheet" href="https://unpkg.com/element-ui/lib/theme-chalk/index.css">
    <style>
        body { margin: 0; padding: 20px; background: #f0f2f5; }
        .page-title { font-size: 18px; font-weight: 600; margin-bottom: 20px; color: #303133; }
        .table-box { background: #fff; padding: 20px; border-radius: 8px; }
    </style>
</head>
<body>
    <div id="app">
        <div class="page-title">✅ 企业资质审核</div>
        <div class="table-box">
            <el-table :data="tableData" border>
                <el-table-column type="index" label="序号" width="60" align="center"></el-table-column>
                <el-table-column prop="companyName" label="企业名称"></el-table-column>
                <el-table-column prop="industry" label="行业" width="100"></el-table-column>
                <el-table-column prop="contactName" label="联系人" width="100"></el-table-column>
                <el-table-column prop="contactPhone" label="联系电话" width="130"></el-table-column>
                <el-table-column label="状态" width="100">
                    <template slot-scope="scope"><el-tag :type="scope.row.status===0?'warning':scope.row.status===1?'success':'danger'">{{ scope.row.status===0?'待审核':scope.row.status===1?'已通过':'已拒绝' }}</el-tag></template>
                </el-table-column>
                <el-table-column label="操作" width="200">
                    <template slot-scope="scope">
                        <el-button size="mini" type="success" @click="handleAudit(scope.row, 1)">通过</el-button>
                        <el-button size="mini" type="danger" @click="handleAudit(scope.row, 2)">拒绝</el-button>
                    </template>
                </el-table-column>
            </el-table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/vue@2.6.14/dist/vue.js"></script>
    <script src="https://unpkg.com/element-ui/lib/index.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios@0.27.2/dist/axios.min.js"></script>
    <script>
        axios.defaults.headers.common['Authorization'] = 'Bearer ' + localStorage.getItem('token');
        new Vue({
            el: '#app',
            data() { return { tableData: [] }; },
            mounted() { this.loadData(); },
            methods: {
                loadData() {
                    axios.get('/api/company/audit-list').then(res => {
                        if (res.data.code === 200) { this.tableData = res.data.data; }
                    });
                },
                handleAudit(row, status) {
                    const msg = status === 1 ? '通过' : '拒绝';
                    this.$confirm('确认「' + msg + '」该企业？', '审核确认', { type: 'warning' }).then(() => {
                        axios.put('/api/company/audit/' + row.id, { status: status }).then(res => {
                            if (res.data.code === 200) { this.$message.success('审核' + msg + '成功'); this.loadData(); }
                        });
                    }).catch(() => {});
                }
            }
        });
    </script>
</body>
</html>
